<!doctype html>
<html lang="en">
  <head>
  	<meta charset="UTF-8" />
  	<title>Anagram Quiz V2</title>
  </head>
  <body>
  	<div>Welcome to Anagram Quiz Game By Kadoc Kun</div>
  	<div>
  	  <button id="randomButton">click here to random</button>
	</div>
	<div>
	  <p id="randomResult">none</p>
	</div>
	<div>
	  <input type="text" id="playerInput" placeholder="type a correct word">
	</div>
	<div>
	  <p id="resultText">not answered yet</p>
	</div>
	<div>
	  <p id="scoreText">Score: <span id="scoreNumber">0</span> </p>
	  <p id="playerLivesText">Life: <span id="playerLives">❤️❤️❤️</span></p>
	</div>
	<div id="gameOverScreen" hidden>
		<h2>Game Over!! Your score will be reset.</h2>
		<p>Final Score: <span id="finalScore">0</span></p>
		<button id="restartButton">Restart</button>
	</div>
	<script src="js/game.js"></script>
  </body>
 </html>
